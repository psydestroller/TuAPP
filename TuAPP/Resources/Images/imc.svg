<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Plataforma principal de la báscula -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="none" stroke="#FFFFFF" stroke-width="36" />
  
  <!-- Pantalla digital superior -->
  <rect x="156" y="110" width="200" height="96" rx="20" fill="#27272A" stroke="#A1A1AA" stroke-width="20" />
  
  <!-- Aguja/Indicador de peso oficial (Verde Esmeralda) -->
